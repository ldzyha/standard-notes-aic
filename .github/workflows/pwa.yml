name: Verify and package local Notes PWA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:browser
      - name: Verify built offline and browser resources
        run: npm test -- test/pwa-offline.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: aic-notes-pwa
          path: dist-pwa/
          if-no-files-found: error
