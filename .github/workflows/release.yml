name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: npm run check

      - name: Verify tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Package desktop extension
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="${RELEASE_TAG#v}"
          mkdir -p .release/dist
          cp package.json .release/package.json
          cp -R dist/. .release/dist/
          cd .release
          zip -qr "../standard-notes-aic-$PACKAGE_VERSION.zip" package.json dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "standard-notes-aic-$PACKAGE_VERSION.zip" \
            --verify-tag \
            --title "AIC $PACKAGE_VERSION" \
            --notes "Website: https://dzyha.com/" \
            --generate-notes
