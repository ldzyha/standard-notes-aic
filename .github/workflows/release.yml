name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.2
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:browser

  release:
    needs: test-platforms
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: npm run check

      - name: Verify tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Build experimental Chrome and Edge package
        run: npm run build:browser

      - name: Package desktop extension
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="${RELEASE_TAG#v}"
          mkdir -p .release/dist
          cp package.json .release/package.json
          cp README.md CHANGELOG.md FUNCTIONAL_INDEX.md .release/
          cp -R dist/. .release/dist/
          cd .release
          zip -qr "../standard-notes-aic-$PACKAGE_VERSION.zip" package.json README.md CHANGELOG.md FUNCTIONAL_INDEX.md dist
          cd ..
          sha256sum "standard-notes-aic-$PACKAGE_VERSION.zip" > "standard-notes-aic-$PACKAGE_VERSION.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="${RELEASE_TAG#v}"
          ASSET="standard-notes-aic-$PACKAGE_VERSION.zip"
          BROWSER_VERSION="$(node -p "require('./browser/manifest.json').version")"
          BROWSER_ASSET="dist-browser/artifacts/aic-browser-chromium-$BROWSER_VERSION.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET" "$ASSET.sha256" \
              "$BROWSER_ASSET" "$BROWSER_ASSET.sha256" MARKETPLACE_HOWTO.md --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$ASSET" "$ASSET.sha256" \
              "$BROWSER_ASSET" "$BROWSER_ASSET.sha256" MARKETPLACE_HOWTO.md \
              --verify-tag \
              --title "AIC $PACKAGE_VERSION" \
              --notes "Includes the experimental Chrome/Edge component $BROWSER_VERSION. Use synthetic data until browser/VERIFICATION.md acceptance gates are resolved. Marketplace submissions are not included. See CHANGELOG.md and MARKETPLACE_HOWTO.md. Website: https://dzyha.com/" \
              --generate-notes
          fi
